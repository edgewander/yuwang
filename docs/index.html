<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>狱望 Prison Art</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="汇集监狱与人文艺术相关的内容，探讨人性、救赎与自由。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --red: #c8001e;
    --ink: #0e0c0b;
    --ink2: #161310;
    --paper: #f0ebe0;
    --grey: #888;
    --rule: #2a2520;
    --sidebar-w: 300px;
    --font-serif: 'Noto Serif SC', 'Songti SC', serif;
    --font-display: 'Playfair Display', serif;
    --font-mono: 'Space Mono', monospace;
  }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-serif);
    overflow-x: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    background: #0a0806 !important;
    border-right: 1px solid var(--rule) !important;
    padding: 0 !important;
    width: var(--sidebar-w) !important;
  }
  .sidebar::before {
    content: '';
    display: block;
    height: 4px;
    background: var(--red);
  }
  .sidebar-nav { padding: 0 !important; }
  .app-name {
    padding: 28px 24px 20px !important;
    border-bottom: 1px solid var(--rule);
    display: block !important;
  }
  .app-name-link {
    display: block !important;
    text-decoration: none !important;
  }
  .app-name-link::before {
    content: '狱望';
    display: block;
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .app-name-link::after {
    content: 'PRISON ART';
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.25em;
    color: #444;
    margin-top: 6px;
  }
  .search {
    margin: 0 !important;
    padding: 12px 16px !important;
    border-bottom: 1px solid var(--rule) !important;
    background: transparent !important;
  }
  .search input {
    background: #1a1612 !important;
    border: 1px solid var(--rule) !important;
    border-radius: 3px !important;
    color: var(--paper) !important;
    font-family: var(--font-mono) !important;
    font-size: 11px !important;
    padding: 8px 12px !important;
    width: 100% !important;
  }
  .search input::placeholder { color: #555 !important; }
  .search input:focus { border-color: var(--red) !important; outline: none !important; }
  .sidebar-nav ul { padding: 8px 0 !important; margin: 0 !important; }
  .sidebar-nav li { list-style: none !important; }
  .sidebar-nav > ul > li > a {
    display: block !important;
    padding: 7px 24px !important;
    font-family: var(--font-serif) !important;
    font-size: 13px !important;
    color: #777 !important;
    text-decoration: none !important;
    letter-spacing: 0.04em !important;
    transition: color 0.15s, background 0.15s !important;
    border-left: 2px solid transparent !important;
  }
  .sidebar-nav > ul > li > a:hover {
    color: var(--paper) !important;
    background: rgba(255,255,255,0.03) !important;
    border-left-color: var(--red) !important;
  }
  .sidebar-nav ul ul { padding-left: 12px !important; }
  .sidebar-nav ul ul a { font-size: 11px !important; color: #555 !important; padding: 3px 24px !important; }

  /* TOP NAV */
  .app-nav {
    position: fixed !important;
    top: 0 !important; right: 0 !important;
    left: var(--sidebar-w) !important;
    height: 48px !important;
    background: var(--ink) !important;
    border-bottom: 1px solid var(--rule) !important;
    display: flex !important;
    align-items: center !important;
    padding: 0 28px !important;
    z-index: 100 !important;
    gap: 24px !important;
    justify-content: flex-end !important;
  }
  .app-nav a {
    font-family: var(--font-mono) !important;
    font-size: 11px !important;
    letter-spacing: 0.12em !important;
    color: #666 !important;
    text-decoration: none !important;
    text-transform: uppercase !important;
    transition: color 0.15s !important;
  }
  .app-nav a:hover { color: var(--paper) !important; }
  .app-nav .map-link {
    color: var(--red) !important;
    border: 1px solid rgba(200,0,30,0.35) !important;
    padding: 5px 14px !important;
    border-radius: 2px !important;
    transition: background 0.15s !important;
  }
  .app-nav .map-link:hover { background: rgba(200,0,30,0.08) !important; }

  /* CONTENT */
  .content { transition: none !important; }
  .content, #main {
    position: fixed !important;
    top: 48px !important;
    left: var(--sidebar-w) !important;
    right: 0 !important;
    bottom: 0 !important;
    overflow-y: auto !important;
  }
  .markdown-section {
    max-width: 860px !important;
    margin: 0 40px !important;
    padding: 48px 48px 80px !important;
    color: #ccc !important;
    font-size: 16px !important;
    line-height: 2 !important;
  }
  .markdown-section h1 {
    font-family: var(--font-display) !important;
    font-size: clamp(24px, 3.5vw, 38px) !important;
    font-weight: 700 !important;
    color: var(--paper) !important;
    line-height: 1.3 !important;
    margin: 0 0 8px !important;
    padding-bottom: 20px !important;
    border-bottom: 1px solid var(--rule) !important;
  }
  .markdown-section h1::before {
    content: '';
    display: block;
    height: 3px;
    width: 36px;
    background: var(--red);
    margin-bottom: 18px;
  }
  .markdown-section h2 {
    font-family: var(--font-serif) !important;
    font-size: 20px !important;
    font-weight: 700 !important;
    color: var(--paper) !important;
    margin: 40px 0 16px !important;
    padding-bottom: 8px !important;
    border-bottom: 1px solid var(--rule) !important;
  }
  .markdown-section h3 { font-size: 17px !important; color: #bbb !important; margin: 28px 0 12px !important; }
  .markdown-section p { margin: 0 0 20px !important; color: #ccc !important; }
  .markdown-section a { color: #d4b896 !important; text-decoration: none !important; border-bottom: 1px solid rgba(212,184,150,0.25) !important; transition: color 0.15s, border-color 0.15s !important; }
  .markdown-section a:hover { color: #f0ebe0 !important; border-bottom-color: #d4b896 !important; }
  .markdown-section blockquote {
    border-left: 3px solid var(--red) !important;
    background: #1a1612 !important;
    margin: 24px auto !important;
    padding: 14px 20px !important;
    color: #bbb !important;
    font-style: italic !important;
    max-width: 560px !important;
  }
  .markdown-section img { max-width: 100% !important; height: auto !important; display: block !important; margin: 28px auto !important; }
  .markdown-section hr { border: none !important; border-top: 1px solid var(--rule) !important; margin: 40px 0 !important; }
  .markdown-section ul, .markdown-section ol { padding-left: 20px !important; color: #ccc !important; }
  .markdown-section li { margin-bottom: 6px !important; }
  .markdown-section code { background: #1a1612 !important; color: #e8a87c !important; padding: 2px 6px !important; border-radius: 3px !important; font-family: var(--font-mono) !important; font-size: 13px !important; }

  /* SIDEBAR TOGGLE */
  .sidebar-toggle { background: var(--ink) !important; border-right: 1px solid var(--rule) !important; border-bottom: 1px solid var(--rule) !important; }
  .sidebar-toggle span { background: #555 !important; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: #2a2520; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--red); }

  /* PROGRESS BAR */
  .reading-progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--red);
    z-index: 9999;
    width: 0%;
    transition: width 0.1s;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .app-nav { left: 0 !important; }
    .markdown-section { padding: 28px 20px 60px !important; }
  }
  </style>
</head>
<body>
  <div class="reading-progress" id="readingProgress"></div>
  <div id="app"></div>
  <script>
    // Reading progress bar
    window.addEventListener('scroll', function() {
      var el = document.getElementById('readingProgress');
      if (!el) return;
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      el.style.width = (docHeight > 0 ? scrollTop / docHeight * 100 : 0) + '%';
    });

    window.$docsify = {
      name: '狱望',
      nameLink: '/',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: '搜索文章…',
        noData: '没有找到相关内容',
        depth: 3
      },
      auto2top: true,
      homepage: "00.md",
      plugins: [
        function(hook, vm) {
          hook.mounted(function() {
            // Top navigation bar
            var nav = document.createElement('div');
            nav.className = 'app-nav';
            nav.innerHTML =
              '<a href="#/">首页</a>' +
              '<a href="#/1.1">全部文章</a>' +
              '<a href="https://map.prison-art.cn" class="map-link" target="_blank">🗺 世界监狱地图</a>';
            document.body.insertBefore(nav, document.getElementById('app'));
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
